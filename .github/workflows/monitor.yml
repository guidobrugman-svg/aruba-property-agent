name: Aruba Property Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install requests beautifulsoup4

      - name: Check Resend secret
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY is available."
          else
            echo "RESEND_API_KEY is missing."
            exit 1
          fi

      - name: Send Resend test email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["RESEND_API_KEY"]

          response = requests.post(
              "https://api.resend.com/emails",
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
              },
              json={
                  "from": "onboarding@resend.dev",
                  "to": ["delivered@resend.dev"],
                  "subject": "Aruba Property Agent - Test",
                  "html": "<p>Your Aruba Property Agent email connection is working.</p>",
              },
              timeout=30,
          )

          print(f"Resend HTTP status: {response.status_code}")
          print(response.text)

          response.raise_for_status()
          PY

      - name: Run monitor
        run: python monitor.py

      - name: Save monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update property monitor state"
          git push
