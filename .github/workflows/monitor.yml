name: Aruba Property Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 12 * * *' # 08:00 Aruba; late runs also catch up once per local day.

permissions:
  contents: write

concurrency:
  group: aruba-property-production
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check Resend secret
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: test -n "$RESEND_API_KEY"
      - name: Discover and prepare durable alerts
        env:
          DEFER_DELIVERY: '1'
          PYTHONUNBUFFERED: '1'
        run: python monitor.py
      - name: Persist discoveries before sending email
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || git commit -m 'Checkpoint property discoveries and outbox'
          git push
      - name: Deliver pending alerts
        env:
          DELIVER_ONLY: '1'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python monitor.py
      - name: Persist email acknowledgements
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || git commit -m 'Update property alert acknowledgements'
          git push
