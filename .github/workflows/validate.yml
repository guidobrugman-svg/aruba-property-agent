name: Validate Property Monitor
on:
  push:
    branches: [improve-monitor-reliability, expand-source-coverage]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Live scan and migration replay (no email secrets, no production writes)
        env:
          DRY_RUN: '1'
          PYTHONUNBUFFERED: '1'
        run: python tools/validate_live.py deep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-validation
          path: live-validation.json
